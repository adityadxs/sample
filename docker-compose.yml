version: '3.8'

services:
  api:
    build: .
    container_name: beverage_vision_api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:///./data/app.db
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped
